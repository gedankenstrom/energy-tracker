version: '3.8'

services:
  energy-tracker:
    image: ghcr.io/gedankenstrom/energy-tracker:latest
    container_name: energy-tracker-new
    ports:
      - "9092:3000"
    environment:
      - PORT=3000
      - READING_DAY=1
    volumes:
      - energy_data:/app/data
    restart: unless-stopped

volumes:
  energy_data:
