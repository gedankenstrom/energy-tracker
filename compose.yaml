services:
  energy-tracker:
    image: ghcr.io/gedankenstrom/energy-tracker:latest
    container_name: energy-tracker
    ports:
      - "9302:9302"
    environment:
      PORT: 9302
      READING_DAY: 1
    volumes:
      - energy_tracker_data:/app/data
    restart: unless-stopped

volumes:
  energy_tracker_data:
